  <circle cx="306" cy="150" r="30" fill="#ffffff"/>
  <path d="M306 120 A30 30 0 0 1 336 150 L276 150 A30 30 0 0 1 306 120 Z" fill="#e8f0ff"/>
  <rect x="300" y="140" width="40" height="17" rx="8" fill="#ff9f1a" stroke="#0b1a33" stroke-width="4"/>
