    <path d="M214 362 L222 304 L262 258" stroke="#13244a" stroke-width="30"/>
    <path d="M262 256 L292 192" stroke="url(#jacket)" stroke-width="46"/>
    <path d="M294 200 L340 238 L376 226" stroke="url(#jacket)" stroke-width="18"/>
