  <!-- ślad po carvingu -->
  <path d="M40 512 C70 450 120 420 175 392" fill="none" stroke="#9fbde4" stroke-width="10" stroke-linecap="round"/>
  <!-- bramki -->
  <g>
    <line x1="76" y1="236" x2="76" y2="300" stroke="#1b2236" stroke-width="5" stroke-linecap="round"/>
    <line x1="112" y1="240" x2="112" y2="304" stroke="#1b2236" stroke-width="5" stroke-linecap="round"/>
    <path d="M76 240 L112 244 L112 274 L76 270 Z" fill="#2f6fe4"/>
