    <path d="M410 304 L472 316 L472 366 L410 354 Z" fill="#e63946"/>
    <path d="M422 318 L460 325" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  </g>
  <!-- pył spod deski -->
  <g fill="#ffffff">
    <circle cx="150" cy="378" r="24" opacity=".95"/>
    <circle cx="120" cy="352" r="18" opacity=".9"/>
    <circle cx="96" cy="322" r="13" opacity=".85"/>
    <circle cx="140" cy="335" r="11" opacity=".8"/>
    <circle cx="78" cy="292" r="8" opacity=".75"/>
    <circle cx="112" cy="300" r="7" opacity=".7"/>
    <circle cx="66" cy="262" r="5" opacity=".65"/>
    <circle cx="176" cy="356" r="12" opacity=".9"/>
  </g>
  <!-- deska -->
  <g transform="rotate(-20 262 352)">
