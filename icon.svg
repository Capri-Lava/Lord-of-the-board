    <rect x="158" y="340" width="208" height="24" rx="12" fill="url(#board)"/>
    <rect x="200" y="338" width="14" height="28" rx="4" fill="#0b1a33"/>
    <rect x="300" y="338" width="14" height="28" rx="4" fill="#0b1a33"/>
