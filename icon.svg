<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081634"/>
      <stop offset=".5" stop-color="#1f5fc8"/>
      <stop offset="1" stop-color="#7cc8ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="390" cy="120" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffd76a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe2f7"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#ff9f1a"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a3a"/>
      <stop offset="1" stop-color="#e8431f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="390" cy="120" r="150" fill="url(#sun)"/>
  <circle cx="390" cy="120" r="30" fill="#fff8dc"/>
