<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lord of the Board">
<meta name="description" content="Retro snowboardowy slalom: odepchnij się, skręcaj przechylając telefon, driftuj między bramkami.">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

<title>Lord of the Board</title>
<style>
  :root{--ink:#2a1b3d;--pink:#ff2e88;--cyan:#2de2e6;--yel:#ffd319;--pur:#7b2ff7;--org:#ff901f;--lil:#e9e0ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:#fff;
    font-family:"Silkscreen",ui-monospace,monospace;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  canvas{position:fixed;inset:0;display:block;touch-action:none;image-rendering:pixelated}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);
    background:linear-gradient(180deg,rgba(42,27,61,.55),rgba(123,47,247,.45) 60%,rgba(255,46,136,.45)),
      repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px);
    text-align:center;z-index:5;overflow-y:auto}
  .hidden{display:none!important}
  .logo{width:96px;height:96px;image-rendering:auto;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:18px}
  h1,.code,.rl b{font-family:"Press Start 2P",ui-monospace,monospace}
  h1{margin:4px 0 6px;font-size:26px;line-height:1.25;font-weight:400;color:#fff;
    text-shadow:2px 2px 0 var(--pink),4px 4px 0 var(--pur),6px 6px 0 var(--ink)}
  h1 span{display:block;font-size:13px;color:var(--yel);text-shadow:2px 2px 0 var(--ink);margin:4px 0}
  h2{margin:0 0 6px;font-size:34px;font-weight:700;text-shadow:3px 3px 0 var(--pink),5px 5px 0 var(--ink)}
  .col{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;width:100%}
  .row>*{flex:1}
  button{font:inherit;font-weight:700;font-size:16px;line-height:1.2;color:var(--ink);padding:14px 6px;cursor:pointer;
    border:3px solid var(--ink);border-radius:4px;background:#fff;box-shadow:4px 4px 0 var(--ink)}
  button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  button:disabled{opacity:.45}
  button small{display:block;font-size:12px;margin-top:6px;min-height:9px;color:var(--pur)}
  .big{font-size:22px;padding:14px 8px;width:100%}
  .pink{background:var(--pink);color:#fff}
  .cyan{background:var(--cyan)}
  .yel{background:var(--yel)}
  .ghost{background:rgba(255,255,255,.15);color:#fff}
  .sel{background:var(--yel)}
  .panel{display:flex;gap:8px;width:100%;animation:drop .18s ease-out}
  .panel>*{flex:1}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .mini{max-width:340px}
  .mini button{font-size:15px;padding:10px 6px}
  .help{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;text-align:left;
    background:rgba(42,27,61,.75);border:3px solid var(--ink);padding:14px;font-size:14px;line-height:1.4;max-width:340px}
  .help .i{font-size:20px;text-align:center;font-family:system-ui,sans-serif}
  .code{font-size:46px;color:var(--yel);text-shadow:4px 4px 0 var(--pink),7px 7px 0 var(--ink);margin:6px 0 10px;letter-spacing:6px}
  input{font:inherit;font-size:28px;text-align:center;letter-spacing:8px;width:100%;
    padding:12px;border:3px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
  .st{font-size:15px;line-height:1.6;min-height:18px;margin:4px 0;color:var(--lil)}
  .lbl{font-size:14px;color:var(--yel);margin-top:4px}
  #res{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
  .rl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:#fff;color:var(--ink);
    border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-size:16px;font-weight:700;text-align:left}
  .rl b{font-size:18px;font-weight:400}
  .rl.win{background:var(--yel)}
  .rl em{display:block;font-style:normal;font-size:12px;color:var(--pur);margin-top:6px;line-height:1.5}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);z-index:9;
    background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 14px;font-size:14px;font-weight:700;line-height:1.4;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="menu" class="ov">
  <img src="icon-192.png" class="logo" alt="">
  <h1>LORD<span>OF THE</span>BOARD</h1>
  <div class="col">
    <button class="big pink" data-acc="aSolo">SOLO</button>
    <div id="aSolo" class="panel hidden">
      <button data-solo="1">ŁATWA<small id="best1"></small></button>
      <button data-solo="2">ŚREDNIA<small id="best2"></small></button>
      <button data-solo="3">TRUDNA<small id="best3"></small></button>
    </div>
    <button class="big cyan" data-acc="aSplit">2 GRACZY</button>
    <div id="aSplit" class="panel hidden">
      <button data-split="1">ŁATWA</button><button data-split="2">ŚREDNIA</button><button data-split="3">TRUDNA</button>
    </div>
    <button class="big yel" data-acc="aNet">ONLINE</button>
    <div id="aNet" class="panel hidden">
      <button id="bHost">NOWY POKÓJ</button><button id="bJoin">DOŁĄCZ</button>
    </div>
    <div class="row mini"><button id="bMusic" class="ghost">♪ ON</button><button class="ghost" data-acc="aHelp">? JAK</button></div>
    <div id="aHelp" class="help hidden">
      <div class="i">👆👆👆</div><div>Stuknij 3× na starcie</div>
      <div class="i">📱</div><div>Przechyl = skręt</div>
      <div class="i">🚩</div><div>Między słupki. Minięta +2s</div>
      <div class="i">🛬</div><div>Ląduj prosto</div>
      <div class="i">🌀</div><div>Obrót w locie −0.5s</div>
      <div class="i">⌨️</div><div>← → spacja · P1: A D W</div>
    </div>
  </div>
</div>

<div id="online" class="ov hidden">
  <h2 id="onTitle"></h2>
  <div id="onHost" class="col" style="align-items:center">
    <div class="code" id="roomCode">----</div>
    <button id="bShare" class="cyan" style="width:100%">ZAPROŚ ↗</button>
    <div class="lbl">TRASA</div>
    <div class="row">
      <button data-ld="1">ŁATWA</button><button data-ld="2" class="sel">ŚREDNIA</button><button data-ld="3">TRUDNA</button>
    </div>
    <button id="bGo" class="big pink" disabled>START!</button>
  </div>
  <div id="onJoin" class="col">
    <input id="codeIn" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
    <button id="bConnect" class="big cyan">POŁĄCZ</button>
  </div>
  <p id="status" class="st"></p>
  <button id="bOnBack" class="ghost" style="width:100%;max-width:340px">◀ WRÓĆ</button>
</div>

<div id="over" class="ov hidden">
  <h2 id="overTxt"></h2>
  <div id="res"></div>
  <div class="col">
    <button id="bAgain" class="big pink">JESZCZE RAZ</button>
    <button id="bOverMenu" class="ghost">MENU</button>
  </div>
</div>

<div id="pause" class="ov hidden">
  <h2 id="pauseTxt">PAUZA</h2>
  <div class="col">
    <button id="bResume" class="big pink">▶ JEDŹ</button>
    <button id="bRestart" class="cyan">↻ OD NOWA</button>
    <button id="bPauseMenu" class="ghost">MENU</button>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const TAU = Math.PI * 2;
const angWrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const modPi = a => { a = angWrap(a); if (a > Math.PI / 2) a -= Math.PI; else if (a < -Math.PI / 2) a += Math.PI; return a; };
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hash = (a, b) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
const fmtT = t => { t = Math.max(0, t); if (t < 60) return t.toFixed(1); const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const fmtR = t => { if (t == null) return '—'; t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return (m ? m + ':' + (s < 10 ? '0' : '') : '') + s.toFixed(2); };
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const FONT = '"Press Start 2P", ui-monospace, monospace', FONT2 = '700 {S}px Silkscreen, ui-monospace, monospace';
try { document.fonts.load('16px "Press Start 2P"'); document.fonts.load('700 16px Silkscreen'); } catch (e) {}

// ====== Paleta (lata 80.) ======
const PAL = { ink: '#2a1b3d', snowA: '#fffaff', snowB: '#f5ecff', line: '#e4d6ff', shadow: '#d2c0ff',
  bank: '#b9a2ff', bankD: '#9f85f2', bankL: '#cdbcff', pink: '#ff2e88', orange: '#ff901f', yellow: '#ffd319',
  cyan: '#2de2e6', purple: '#7b2ff7', mint: '#3ee8a5', tree: '#16958a', treeD: '#0d6a63', treeL: '#2cc3b0', trunk: '#6b3b5e', white: '#ffffff', lil: '#e9e0ff' };
const RAINBOW = [PAL.pink, PAL.orange, PAL.yellow, PAL.mint, PAL.cyan, PAL.purple];

// ====== Ustawienia jazdy (jednostka = piksel gry) ======
const HMAX = .96;        // maks. kąt deski od linii spadku (~55°)
const HRATE = 3.6;       // jak szybko deska obraca się do zadanego kąta (rad/s)
const GRIPA = 560;       // przyczepność krawędzi: tyle przyspieszenia w bok trzyma, reszta to drift
const VMIN = 135;        // poniżej tej prędkości nie zwalniasz
const GZ = 520;          // grawitacja w locie
const PEN = 2;           // kara za ominiętą bramkę
const STEP = 1 / 120;
const DIFF = {
  1: { name: 'ŁATWA',   len: 12000, width: 176, gw: 84, vmax: 245, jumps: 2, jh: 20, amp: 40, gap: 330, off: .2 },
  2: { name: 'ŚREDNIA', len: 15000, width: 156, gw: 70, vmax: 285, jumps: 3, jh: 24, amp: 60, gap: 300, off: .27 },
  3: { name: 'TRUDNA',  len: 18000, width: 138, gw: 60, vmax: 325, jumps: 4, jh: 28, amp: 80, gap: 270, off: .33 },
};
const SOLO_SEED = { 1: 1201, 2: 2702, 3: 3903 };

// ====== Trasa ======
function genCourse(seed, d) {
  const P = DIFF[d], r = rng(seed);
  const C = { seed, d, P, len: P.len, gates: [], jumps: [] };
  const waves = [[P.amp * (.7 + .5 * r()), 1800 + 900 * r(), r() * TAU], [P.amp * (.35 + .3 * r()), 700 + 400 * r(), r() * TAU]];
  const raw = y => waves[0][0] * Math.sin(TAU * y / waves[0][1] + waves[0][2]) + waves[1][0] * Math.sin(TAU * y / waves[1][1] + waves[1][2]);
  const r0 = raw(150), wf = r() * TAU, sf = r() * TAU;
  C.cx = y => smooth(clamp((y - 150) / 700, 0, 1)) * (raw(y) - r0);
  C.hw = y => P.width / 2 * (1 + .08 * Math.sin(TAU * y / 1500 + wf));
  C.speedK = y => y < 120 ? .55 : 1 + .1 * Math.sin(TAU * y / 2600 + sf);
  for (let i = 0; i < P.jumps; i++)
    C.jumps.push({ y: Math.round(C.len * (.18 + .66 * (i + .5) / P.jumps) + (r() - .5) * 300), L: 46, H: P.jh });
  let side = r() < .5 ? -1 : 1, y = 520;
  while (y < C.len - 300) {
    if (!C.jumps.some(j => y > j.y - 140 && y < j.y + j.L + 330)) {
      const c = C.cx(y), hw = C.hw(y), lim = hw - P.gw / 2 - 8;
      C.gates.push({ x: clamp(c + side * hw * (P.off + .12 * r()), c - lim, c + lim), y, side });
      side = -side;
    }
    y += P.gap * (.85 + .3 * r());
  }
  C.ground = y => { for (const j of C.jumps) if (y >= j.y && y <= j.y + j.L) return (y - j.y) / j.L * j.H; return 0; };
  C.ramp = y => { for (const j of C.jumps) if (y >= j.y && y <= j.y + j.L) return j; return null; };
  return C;
}

// ====== Zawodnik ======
function mkRider(scheme, name) {
  return { x: 0, y: -40, v: 0, a: 0, h: 0, w: 0, z: 0, vz: 0, air: false, spin: 0, inp: 0, raw: 0, slip: 0, slipS: 1,
    ph: 'wait', pushes: 0, lastTap: 0, pushQ: 0, crashT: 0, crashA: 0, gi: 0, gres: [], ok: 0, miss: 0, pen: 0, bonus: 0,
    combo: 0, fin: null, raw_t: null, trail: [], tlx: 0, tly: -40, bub: null, bumpT: 0, shake: 0, scheme, name, rec: [], snd: false };
}
const vx = R => Math.sin(R.a) * R.v, vy = R => Math.cos(R.a) * R.v;
function say(R, t, kind) { R.bub = { t, k: kind || 'good', age: 0, side: R.bub ? -R.bub.side : 1 }; }

function tap(R) {
  if (!R || G.phase !== 'race' || R.ph !== 'push' || R.pushes >= 3) return;
  const dt = G.t - (R.pushes ? R.lastTap : 0);
  const q = clamp(1 - (dt - .12) / .45, 0, 1);       // im szybciej po sobie, tym mocniej
  R.v += 30 + 52 * q;
  R.pushQ += q; R.pushes++; R.lastTap = G.t;
  if (R.snd) { sfx('push', R.pushes); vib(15); }
  if (R.pushes === 3) startRide(R);
}
function startRide(R) {
  R.ph = 'ride';
  const p = Math.round(R.pushQ / 3 * 100);
  say(R, p + '%', p >= 80 ? 'trick' : p >= 50 ? 'good' : 'info');
}
function crash(R) {
  if (R.ph === 'crash') return;
  R.ph = 'crash'; R.crashT = .8; R.air = false; R.z = 0; R.vz = 0; R.combo = 0;
  say(R, 'AUĆ!', 'bad'); burst(R, 22, 120, null); R.shake = 7;
  if (R.snd) { sfx('crash'); vib([50, 30, 90]); }
}
function land(R, C) {
  const dm = modPi(R.h - R.a), n180 = Math.round(Math.abs(R.spin) / Math.PI);
  R.air = false; R.vz = 0; R.z = C.ground(R.y); R.w = 0;
  R.h = clamp(R.a + dm, -HMAX, HMAX);
  burst(R, 12, 70, null); R.shake = 3;
  if (Math.abs(dm) > 1.0) { crash(R); return; }
  if (Math.abs(dm) > .5) { R.v *= .85; say(R, 'UPS!', 'info'); }
  else if (!n180) say(R, 'SUPER!', 'good');
  if (n180 >= 1) {
    const bn = .5 * n180; R.bonus += bn;
    say(R, (n180 * 180) + '° −' + bn + 's', 'trick');
    burst(R, 20, 110, RAINBOW);
    if (R.snd) sfx('trick');
  }
  if (R.snd) { sfx('land'); vib(25); }
}

function stepRider(R, C, dt) {
  if (R.ph === 'wait' || (R.ph === 'push' && !R.pushes)) return;
  const P = C.P, px = R.x, py = R.y;
  R.bumpT -= dt;
  if (R.ph === 'crash') {
    R.crashT -= dt; R.crashA += dt * 15;
    R.v = Math.max(VMIN * .75, R.v - 220 * dt);
    R.x += vx(R) * dt; R.y += vy(R) * dt;
    if (R.crashT <= 0) { R.ph = R.fin != null ? 'done' : 'ride'; R.a = R.h = clamp(R.a, -.3, .3); R.crashA = 0; }
  } else if (R.air) {
    R.vz -= GZ * dt; R.z += R.vz * dt;
    if (Math.abs(R.inp) > .2) R.w = R.inp * 7.5;          // trzymasz skręt = kręcisz obrót
    else R.w = clamp(modPi(R.a - R.h) * 6, -5, 5);         // puszczasz = deska sama ustawia się do lądowania
    R.h += R.w * dt; R.spin += R.w * dt;
    R.x += vx(R) * dt; R.y += vy(R) * dt;
    if (R.z <= C.ground(R.y)) land(R, C);
  } else {
    const tgt = R.ph === 'done' ? 0 : R.inp * HMAX;
    R.h += clamp(tgt - R.h, -HRATE * dt, HRATE * dt);
    const maxTurn = GRIPA / Math.max(80, R.v) * dt;       // im szybciej, tym wolniej tor jazdy nadąża za deską — drift
    R.a += clamp(R.h - R.a, -maxTurn, maxTurn);
    const slip = R.h - R.a; R.slip = Math.abs(slip); R.slipS = Math.sign(slip) || 1;
    const vT = P.vmax * (1 - .2 * Math.abs(Math.sin(R.a))) * C.speedK(R.y);
    if (R.ph === 'push') R.v += 15 * dt;
    else R.v += (vT - R.v) * (R.v < vT ? .5 : .9) * dt;
    R.v -= Math.abs(Math.sin(slip)) * R.v * 1.1 * dt;      // poślizg hamuje
    if (C.ramp(R.y)) R.v -= 30 * dt;
    if (R.ph === 'ride' && R.y > 300) R.v = Math.max(VMIN, R.v);
    if (R.ph === 'done') R.v = Math.max(0, R.v - 170 * dt);
    R.x += vx(R) * dt; R.y += vy(R) * dt;
    for (const j of C.jumps) {
      const top = j.y + j.L;
      if (py < top && R.y >= top && R.ph !== 'done') {
        R.air = true; R.z = j.H; R.vz = R.v * j.H / j.L * .9 + 60; R.spin = 0; R.w = 0;
        if (R.snd) sfx('jump');
      }
    }
    if (!R.air) R.z = C.ground(R.y);
  }
  // bandy po bokach — tylko odbicie
  const c = C.cx(R.y), lim = C.hw(R.y) - 11, d = R.x - c;
  if (Math.abs(d) > lim && !(R.air && R.z > 16)) {
    const sd = Math.sign(d);
    R.x = c + sd * lim;
    if (Math.sin(R.a) * sd > -.05) {
      R.a = -sd * Math.max(.18, Math.abs(R.a) * .5);
      if (!R.air) R.h = R.a;
      R.v *= .9; R.shake = 5;
      burst(R, 8, 80, [PAL.pink, PAL.yellow]);
      if (R.snd) { sfx('bump'); vib(30); }
      if (R.bumpT <= 0) { say(R, 'BUM!', 'bad'); R.bumpT = 1.5; }
    }
  }
  // bramki
  const g = C.gates[R.gi];
  if (g && py < g.y && R.y >= g.y) {
    const gx = px + (R.x - px) * (g.y - py) / (R.y - py);
    if (Math.abs(gx - g.x) <= P.gw / 2) {
      R.gres[R.gi] = 1; R.ok++; R.combo++;
      sparkle(g, C);
      if (R.snd) sfx('gate', R.combo);
      if (R.combo % 5 === 0) say(R, '×' + R.combo + '!', 'trick');
    } else {
      R.gres[R.gi] = 2; R.miss++; R.pen += PEN; R.combo = 0;
      say(R, '+' + PEN + 's', 'bad');
      if (R.snd) { sfx('miss'); vib(70); }
    }
    R.gi++;
  }
  // meta
  if (R.fin == null && R.y >= C.len) {
    const f = (C.len - py) / Math.max(1e-6, R.y - py), tt = G.t - dt * (1 - f);
    R.raw_t = tt; R.fin = tt + R.pen - R.bonus;
    if (R.ph !== 'crash') R.ph = 'done';
    say(R, 'META!', 'trick'); burst(R, 30, 140, RAINBOW);
    if (R.snd) { sfx('finish'); vib(60); }
  }

    if (navigator.share) await navigator.share({ title: 'Lord of the Board', text: 'Ścigamy się! Kod: ' + roomCode, url });
    else { await navigator.clipboard.writeText(url); toast('Link skopiowany ✔'); }
  } catch (_) {}
};
$('bAgain').onclick = () => {
  initAudio();
  if (G.mode === 'online') {
    if (G.rivalGone || !net) { leaveOnline(); return; }
    G.wantMe = true;
    if (net === 'host' && G.wantPeer) { sendGo(); return; }
    nsend({ t: 'r' }); lastWantTx = performance.now();
    $('bAgain').textContent = 'CZEKAM…';
  } else restart();
};
$('bOverMenu').onclick = () => { hide('over'); net ? leaveOnline() : toDemo(); };
$('bResume').onclick = resume;
$('bRestart').onclick = () => { hide('pause'); G.paused = false; restart(); };
$('bPauseMenu').onclick = () => { hide('pause'); G.paused = false; net ? leaveOnline() : toDemo(); };
['menu', 'online', 'over', 'pause'].forEach(id => $(id).addEventListener('pointerdown', () => initAudio()));

toDemo();
const qRoom = new URLSearchParams(location.search).get('room');
if (qRoom) { history.replaceState(null, '', location.pathname); showOnline('join'); $('codeIn').value = qRoom; joinRoom(qRoom); }
requestAnimationFrame(frame);
</script>
